<!DOCTYPE html>
<html>
<head><title>Gerador de Ícones - Tati Fitness</title></head>
<body>
<script>
// Generate PWA icons as PNG using Canvas
const sizes = [72, 96, 128, 144, 152, 192, 384, 512];

function generateIcon(size) {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');

    // Background gradient
    const grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, '#FF6B6B');
    grad.addColorStop(1, '#E85555');
    ctx.fillStyle = grad;

    // Rounded rect
    const r = size * 0.15;
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(size - r, 0);
    ctx.quadraticCurveTo(size, 0, size, r);
    ctx.lineTo(size, size - r);
    ctx.quadraticCurveTo(size, size, size - r, size);
    ctx.lineTo(r, size);
    ctx.quadraticCurveTo(0, size, 0, size - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();
    ctx.fill();

    // Dumbbell icon
    const cx = size / 2;
    const cy = size / 2;
    const scale = size / 512;

    ctx.fillStyle = 'white';
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 20 * scale;
    ctx.lineCap = 'round';

    // Bar
    ctx.beginPath();
    ctx.moveTo(cx - 100 * scale, cy);
    ctx.lineTo(cx + 100 * scale, cy);
    ctx.stroke();

    // Left plates
    ctx.fillRect(cx - 120 * scale, cy - 60 * scale, 30 * scale, 120 * scale);
    ctx.fillRect(cx - 150 * scale, cy - 45 * scale, 20 * scale, 90 * scale);

    // Right plates
    ctx.fillRect(cx + 90 * scale, cy - 60 * scale, 30 * scale, 120 * scale);
    ctx.fillRect(cx + 130 * scale, cy - 45 * scale, 20 * scale, 90 * scale);

    // Text
    ctx.fillStyle = 'white';
    ctx.font = `bold ${65 * scale}px Poppins, Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('TP', cx, cy + 115 * scale);

    return canvas.toDataURL('image/png');
}

// Generate and create download links
sizes.forEach(size => {
    const dataUrl = generateIcon(size);
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = `icon-${size}x${size}.png`;
    a.textContent = `Download ${size}x${size}`;
    a.style.display = 'block';
    a.style.margin = '10px';
    document.body.appendChild(a);

    const img = document.createElement('img');
    img.src = dataUrl;
    img.style.width = Math.min(size, 128) + 'px';
    img.style.margin = '10px';
    document.body.appendChild(img);
});

document.body.insertAdjacentHTML('afterbegin', '<h1>Ícones gerados! Clique para baixar cada um e coloque na pasta icons/</h1>');
</script>
</body>
</html>
